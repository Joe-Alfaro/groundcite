[project]
name = "groundcite"
version = "0.1.0"
description = "Fine-tuning a small instruct model for grounded, cited diagnostic steps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.3.0",
    "openai==3.40.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
hf = [
    "torch==2.14.1",
    "transformers==5.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundcite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]
