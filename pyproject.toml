[project]
name = "groundcite"
version = "0.1.0"
description = "Fine-tuning a small instruct model for grounded, cited diagnostic steps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Training (train/train_qlora.py): the transformers Trainer needs accelerate; the Hub push
    # uses huggingface-hub. Unsloth is a Kaggle-only install in train/kaggle_train.ipynb.
    "accelerate==1.15.0",
    "anthropic==2.3.0",
    "openai==3.40.0",
    "huggingface-hub==2.3.0",
    "peft==0.21.2",
    "python-dotenv==1.2.4",
    # Local hf: models (eval.py --model hf:...). Core, not an extra, so the eval is one command.
    "torch==2.14.1",
    "transformers==5.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundcite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]
