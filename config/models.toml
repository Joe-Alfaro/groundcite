# Pinned model ids and fixed decoding parameters (R13, R28). Change these only with a decision
# log entry: every result records the ids and the effective decoding parameters it ran with.

[judge]
# D-080: Claude Opus replaced OpenAI gpt-5.5 (M1 and the H1 pilot were scored by gpt-5.5; compare
# them only through re-judged runs, scripts/rejudge.py). A complete pinned id, never a -latest
# alias (Anthropic dates no snapshot of it). It shares the teacher's family: a self-preference
# risk the R29 hand-label audit checks.
model = "anthropic:claude-opus-5-5"

[judge_candidates]
# The D-096 judge-agreement check (scripts/judge_agreement.py): each candidate re-scores the
# committed sample, compared with the reference judge that scored M1 and the pilot. Grok becomes
# the judge only if it passes the D-096 bar (D-095); Sonnet and Haiku are reference points.
models = [
    "xai:grok-4.20-0309-reasoning",
    "anthropic:claude-sonnet-5-5",
    "anthropic:claude-haiku-5-5",
]
reference = "openai:gpt-5.5-2026-04-23"

[xai]
# Which xAI API the xai: backend calls: "responses" (xAI's recommended API) or "chat" (Chat
# Completions, the fallback). [decoding.xai] must use the matching output-token cap.
api = "responses"

[teacher]
model = "anthropic:claude-opus-5-5"

[cross_check]
# DISABLED (D-086): no second-family judge has credits, and nothing reads this table. The value
# stays only because the D-019 config test pins it; judge validity rests on the R29 hand-label
# audit and the M1/pilot gpt-5.5 vs Opus re-judge agreement.
model = "anthropic:claude-opus-5-5"

[eval]
# The base model's second row in eval.py uses this prompt strategy (R10, GOTCHA G39). It must be
# few_shot or structured, and it is set from the ablation result with a decision log entry.
best_strategy = "structured"

[ablation]
models = ["anthropic:claude-opus-5-5", "openai:gpt-5.5-2026-04-23"]

# Decoding parameters per provider, sent as-is in every request body. A model that rejects one of
# them (some reject temperature) gets the request again without it, and the backend records the
# parameters that actually ran (`Backend.effective_params`).
[decoding.anthropic]
temperature = 0
max_tokens = 16000
output_config = { effort = "medium" }

[decoding.openai]
temperature = 0
max_completion_tokens = 16000
reasoning_effort = "low"

[decoding.xai]
temperature = 0
max_output_tokens = 16000

[decoding.hf]
do_sample = false
max_new_tokens = 256

# USD per million tokens, for dry-run estimates and recorded spend (config.cost_usd). Reasoning
# tokens bill at the output price. Sources, checked 2026-10-28: the xAI models page
# (docs.x.ai/docs/models) for Grok; Anthropic's pricing page (anthropic.com/pricing) for Claude.
[prices]
"xai:grok-4.20-0309-reasoning" = { input_per_mtok = 1.25, output_per_mtok = 2.50 }
"anthropic:claude-opus-5-5" = { input_per_mtok = 4.0, output_per_mtok = 20.0 }
"anthropic:claude-sonnet-5-5" = { input_per_mtok = 2.0, output_per_mtok = 10.0 }
"anthropic:claude-haiku-5-5" = { input_per_mtok = 0.10, output_per_mtok = 0.50 }
