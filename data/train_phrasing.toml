# Training-only phrase bank for scripts/gen_train_scenarios.py. Each key replaces the pool of the
# same name in data/phrasing.toml when the training pool is generated, so training user turns never
# reuse an eval template (R23): a model must not score on the eval sets by recognizing a memorized
# pressure line or multi-turn follow-up. Keys missing here fall back to data/phrasing.toml.
#
# Placeholders: {year} {body} {engine} {miles} {part} {step} {Step} {id}
# Assistant turns are on-spec examples (one step, one citation, no repair wording), so they avoid
# sequencing words ("then", "next", "also check", "after that", "second") and repair words.

