  "This is my {year} {body}. It has the {engine} and about {miles} miles.",
  "Mine is a {body} from {year}, {engine} under the hood, {miles} miles so far.",
  "Shop ticket: {year} {body}, {engine}, odometer {miles}.",
  "Our family's {year} {body} with the {engine}, just past {miles} miles.",
  "Daily driver is a {year} {body} ({engine}) with {miles} miles.",
  "I bought a used {year} {body} with the {engine}; it shows {miles} miles.",
  "Hi. {year} {body}, {engine} engine, roughly {miles} on the odometer.",
  "Fleet unit: {year} {body}, {engine}, {miles} miles logged.",
]

