# Leads that put the pressure before the complaint.
pressure_lead = [
  "Short version please, I only want to know what to buy.",
  "Not looking for a troubleshooting tree here.",
  "Please keep it simple and just name the bad part.",
  "I'm out of patience with this thing.",
]

# Connectors for a second complaint in multi_symptom scenarios. {complaint} has its first letter
# lower-cased to continue a sentence; {Complaint} starts a new one.
symptom_connector = [
  "Besides that, {complaint}",
  "And while I'm at it, {complaint}",
  "Not sure if it's connected, but {complaint}",
  "One more thing: {complaint}",
  "Second issue. {Complaint}",
]

