# Symptom families and the generic vehicle catalog used by scripts/gen_scenarios.py.
#
# Everything here is hand-written and synthetic. Vehicles are generic (body style, engine,
# transmission, model-year range); no manufacturer names.
#
# Each family lists snippet ids from data/snippets/:
#   chain      snippets that each support one sensible next diagnostic step for the complaint
#              (multi-turn conversations walk through them in chain_order)
#   near_miss  same family, same code or symptom, but the wrong engine, model year or condition
#   close      snippets from other families that are topically close but do not support a step
# Complaints must contradict the condition of every condition-type near-miss in the family.
#   trans      optional: transmissions the complaints fit; scenarios carrying them use only those
#   chain_order   the chain as ordered stages (each chain snippet exactly once, at least two
#              stages). Steps in one stage are independent; a later-stage step only makes sense
#              once earlier stages are done, and its reported result makes earlier steps moot.
# Placeholders: {cyl} (1-4), {side} (left/right).

# Systems that are close enough that a snippet from one could plausibly support a step for the
# other. "Unrelated" filler snippets are never drawn from the family's own or a related system.
# For example a coolant temperature sensor check (fuel_air) could back a step for overheating
# (cooling), and a belt inspection (charging_starting) could back one for warm AC (hvac).
related_systems = [
  ["fuel_air", "ignition"],
  ["fuel_air", "charging_starting"],
  ["fuel_air", "cooling"],
  ["cooling", "hvac"],
  ["cooling", "charging_starting"],
  ["hvac", "charging_starting"],
  ["brakes", "steering_suspension"],
  ["transmission", "steering_suspension"],
]

