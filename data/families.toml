# The complaints describe a conventional automatic, so every scenario that carries one does too.
trans = ["automatic"]
near_miss = ["harsh_shift.nm_cvt", "harsh_shift.nm_cold", "harsh_shift.nm_relearn"]
close = []
suspects = ["shift solenoid", "torque converter", "valve body", "transmission control module"]
complaints = [
  "The automatic slams into second, a hard 1-2 shift, and it's worse once the transmission is fully warmed up.",
  "Upshifts are harsh, especially 2-3, and there's a delay before it engages. It gets worse the longer I drive.",
  "Hard, delayed shifts once the car is warm. The first few miles cold are actually smoother.",
