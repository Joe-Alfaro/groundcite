# Hand-written phrasing pools for scripts/gen_scenarios.py. The generator picks from these with
# a seeded RNG so user turns vary in voice, order and pressure instead of following one template.
#
# Placeholders: {year} {body} {engine} {miles} {part} {step} {Step} {id} {result}
# Assistant turns are on-spec examples (one step, one citation, no repair wording), so they avoid
# sequencing words ("then", "next", "also check", "after that", "second") and repair words.

