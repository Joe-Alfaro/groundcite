  "I have a {year} {body} with the {engine}, about {miles} miles.",
  "{year} {body}, {engine}, {miles} miles.",
  "My {body} is a {year} with the {engine} and {miles} on the clock.",
  "Working on a {year} {body} ({engine}, {miles} miles).",
  "Customer vehicle: {year} {body}, {engine}, {miles} mi.",
  "It's a {year} {body}, {engine}, roughly {miles} miles.",
  "Vehicle is a {year} {body} with the {engine}. Odometer shows {miles}.",
]

